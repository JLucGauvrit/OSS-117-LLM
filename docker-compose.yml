#version: '3.8'

services:
  # Service de collecte de données
  data_collector:
    build:
      context: ./data/collect_data
    container_name: oss117_data_collector
    volumes:
      - ./raw_data:/app/raw_data
    restart: on-failure
    develop:
      watch:
        - path: ./data/collect_data
          target: /app
          action: sync+restart
    networks:
      - monitoring_network

  # Prometheus pour la collecte des métriques
  prometheus:
    image: prom/prometheus:latest
    container_name: oss117_prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    ports:
      - "9090:9090"
    restart: unless-stopped
    networks:
      - monitoring_network

  # Node Exporter pour les métriques système (CPU, RAM, disque, réseau)
  node_exporter:
    image: prom/node-exporter:latest
    container_name: oss117_node_exporter
    ports:
      - "9100:9100"
    restart: unless-stopped
    networks:
      - monitoring_network

  # cAdvisor pour les métriques de conteneurs Docker
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: oss117_cadvisor
    command: 
      - --docker_only=true
      - --store_container_labels=false
      - --whitelisted_container_labels=io.kubernetes.pod.namespace,io.kubernetes.pod.name,io.kubernetes.container.name
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk/:ro
    ports:
      - "8080:8080"
    restart: unless-stopped
    privileged: true
    networks:
      - monitoring_network

  # Grafana pour la visualisation
  grafana:
    image: grafana/grafana:latest
    container_name: oss117_grafana
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    ports:
      - "3000:3000"
    restart: unless-stopped
    depends_on:
      - prometheus
    networks:
      - monitoring_network

  dcgm-exporter:
    image: nvidia/dcgm-exporter:latest
    container_name: dcgm_exporter
    runtime: nvidia
    privileged: true
    volumes:
      - /sys:/sys:ro
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
    ports:
      - "9400:9400"
    restart: unless-stopped
    networks:
      - monitoring_network

volumes:
  prometheus_data:
  grafana_data:

networks:
  monitoring_network:
    driver: bridge
